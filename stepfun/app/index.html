<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stepfun 端侧知识库 — seekdb 混合检索</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1216; --panel: #171b21; --border: #2a3038; --fg: #dbe2ea;
      --dim: #8b96a3; --accent: #4da3ff; --ok: #46c58f; --warn: #e8b34b; --err: #e86a5e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    .chip { border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--dim); }
    .chip b { color: var(--fg); font-weight: 600; }
    .chip.ok b { color: var(--ok); } .chip.warn b { color: var(--warn); } .chip.err b { color: var(--err); }
    main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; padding: 16px 20px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
    label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 4px; }
    input[type="text"], input[type="number"], select { width: 100%; background: #0d1013; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    button { background: var(--accent); color: #04121f; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
    .progress { height: 8px; background: #0d1013; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
    .log { margin-top: 10px; font-size: 12px; color: var(--dim); max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
    .result { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; }
    .result .meta { font-size: 12px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }
    .result .txt { margin-top: 6px; font-size: 13px; }
    mark { background: #4da3ff33; color: var(--fg); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
    th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    th { color: var(--dim); font-weight: 600; }
    .muted { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>端侧迷你知识库 · seekdb 混合检索</h1>
    <span class="chip" id="chip-backend">推理后端: <b>检测中…</b></span>
    <span class="chip" id="chip-dtype">精度: <b>—</b></span>
    <span class="chip" id="chip-model">模型: <b>未加载</b></span>
    <span class="chip" id="chip-db">seekdb: <b>检测中…</b></span>
    <span class="chip" id="chip-kb">集合: <b>—</b></span>
  </header>
  <main>
    <div>
      <div class="panel">
        <h2>导入文档（浏览器本地向量化）</h2>
        <label>知识库集合名</label>
        <input type="text" id="kb-name" value="main" />
        <label>模型精度（量化方案）</label>
        <select id="dtype">
          <option value="q8" selected>INT8 (q8) — 22.0 MB</option>
          <option value="fp16">FP16 — 43.2 MB</option>
          <option value="fp32">FP32 基线 — 86.2 MB</option>
        </select>
        <label>推理后端</label>
        <select id="backend">
          <option value="webgpu" selected>WebGPU（优先）</option>
          <option value="wasm">WASM（强制降级）</option>
        </select>
        <label>选择文本文件（.txt / .md，可多选）</label>
        <input type="file" id="files" multiple accept=".txt,.md" />
        <div class="row" style="margin-top:10px">
          <button id="btn-import">导入所选文件</button>
          <button id="btn-corpus" class="ghost">一键导入示例语料(200篇)</button>
        </div>
        <div class="progress"><div id="bar"></div></div>
        <div class="log" id="import-log"></div>
      </div>
      <div class="panel">
        <h2>评测与性能（真实运行数据）</h2>
        <label>评测集合（写入 seekdb 的独立集合）</label>
        <input type="text" id="eval-kb" value="eval-q8-webgpu" />
        <div class="row" style="margin-top:10px">
          <button id="btn-eval">运行质量评测 (Recall@K / nDCG@K)</button>
          <button id="btn-perf" class="ghost">运行性能测试 (5 次重复)</button>
        </div>
        <label style="margin-top:8px">性能测试批大小</label>
        <select id="perf-batch">
          <option value="16" selected>batch = 16（默认）</option>
          <option value="64">batch = 64（优化后）</option>
          <option value="1">batch = 1（逐条，优化前对照）</option>
        </select>
        <div class="row" style="margin-top:10px">
          <button id="btn-export" class="ghost">导出最近一次原始数据 JSON</button>
        </div>
        <div class="log" id="eval-log"></div>
        <div id="eval-table"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>混合检索（seekdb 一条 SQL：全文 + 向量 ANN）</h2>
        <div class="row">
          <input type="text" id="query" placeholder="输入查询，例如：HNSW 索引是如何组织向量并完成近邻搜索的？" />
        </div>
        <div class="row" style="margin-top:8px">
          <label>Top-K <input type="number" id="k" value="5" min="1" max="50" /></label>
          <label>模式
            <select id="mode">
              <option value="hybrid" selected>混合（MATCH 全文 + 向量排序）</option>
              <option value="vector">纯向量 ANN</option>
            </select>
          </label>
          <button id="btn-search" style="flex:0 0 auto">检索</button>
        </div>
        <div class="muted" id="search-timing"></div>
        <div id="results"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
