    - data:
        code: "import json\nimport re\n\n\ndef _obj(value):\n    if isinstance(value,\
          \ dict):\n        return value\n    if isinstance(value, str):\n       \
          \ try:\n            return json.loads(value)\n        except Exception:\n\
          \            return {}\n    return {}\n\n\ndef main(action_body: str, remember:\
          \ str, message: str) -> dict:\n    data = _obj(action_body)\n    ok = bool(data.get(\"\
          ok\", False))\n    state = data.get(\"state\", {}) or {}\n    player = state.get(\"\
          player\", {}) or {}\n    error = data.get(\"error\", {}) or {}\n    result_text\
          \ = data.get(\"result_text\", \"\") or \"\"\n    memory = data.get(\"memory\"\
          , \"\") or \"\"\n    if not memory:\n        memory = remember or f\"玩家在忘忧酒馆说：「{message[:120]}」\"\
          \n    memory = re.sub(r\"[\\r\\n]+\", \" \", memory).replace('\"', \"'\"\
          ).replace(\"\\\\\", \"／\").strip()[:400]\n    action_fact = result_text\
          \ if ok else error.get(\"message\", \"阿九没有回应。\")\n    compact = {\n    \
          \    \"player\": player,\n        \"menu\": state.get(\"menu\", []),\n \
          \       \"recent_events\": state.get(\"recent_events\", []),\n        \"\
          grudge_level\": state.get(\"grudge_level\", \"\"),\n    }\n    return {\n\
          \        \"ok\": ok,\n        \"action_name\": data.get(\"action\", \"\"\
          ) or \"\",\n        \"action_fact\": str(action_fact)[:600],\n        \"\
          error_message\": str(error.get(\"message\", \"\") or \"\")[:300],\n    \
          \    \"status_bar\": state.get(\"status_bar\", \"\") or \"\",\n        \"\
          player_name\": player.get(\"nickname\", \"无名客\") or \"无名客\",\n        \"\
          memory_text\": memory,\n        \"state_json\": json.dumps(compact, ensure_ascii=False),\n\
          \    }\n"
        code_language: python3
        desc: ''
        outputs:
          action_fact:
            children: null
            type: string
          action_name:
            children: null
            type: string
          error_message:
            children: null
            type: string
          memory_text:
            children: null
            type: string
          ok:
            children: null
            type: boolean
          player_name:
            children: null
            type: string
          state_json:
            children: null
            type: string
          status_bar:
            children: null
            type: string
