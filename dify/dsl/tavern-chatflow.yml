    - data:
        code: "import re\n\n\ndef main(reply_text: str) -> dict:\n    text = reply_text\
          \ or \"\"\n    text = re.sub(r\"(?is)<think.*?</think>\", \"\", text)\n\
          \    text = text.replace(\"<think>\", \"\").replace(\"</think>\", \"\")\n\
          \    text = text.strip()\n    text = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\"\
          , text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n    if not text:\n\
          \        text = \"（阿九把抹布往肩上一搭，没接话，只把账本翻到了你那一页。）\"\n    return {\"reply\"\
          : text[:1500]}\n"
