app:
  description: 雨夜酒馆，掌柜阿九会记住你的每一笔账和每一次恶作剧。
  icon: 🍶
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 忘忧酒馆 · 记仇掌柜
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.26@bdf47cb41e9062bba00d26625d2a795c1874011d8ce64bff738c44b5a31787ea
    version: null
kind: app
site:
  chat_color_theme: light
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: zh-Hans
  description: 一个会记住你恶作剧的 NPC。
  icon: 🍶
  icon_background: '#FFEAD5'
  icon_type: emoji
  input_placeholder: 雨夜推门，和阿九说点什么……
  privacy_policy: null
  show_workflow_steps: true
  title: 忘忧酒馆 · 记仇掌柜
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    opening_statement: 雨夜，忘忧酒馆的门被风推开。柜台后的阿九抬了抬眼：「又是你？坐吧，酒钱先记着。」
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 来一杯忘忧酿
    - 后巷最近有什么传闻？
    - 老板，我把你吧台的盐罐换成糖了
    - 我还欠你多少？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-source-clean_input
      source: start
      sourceHandle: source
      target: clean_input
      targetHandle: target
    - id: clean_input-source-scope
      source: clean_input
      sourceHandle: source
      target: scope
      targetHandle: target
    - id: scope-source-parse_scope
      source: scope
      sourceHandle: source
      target: parse_scope
      targetHandle: target
    - id: parse_scope-source-state
      source: parse_scope
      sourceHandle: source
      target: state
      targetHandle: target
    - id: state-source-parse_state
      source: state
      sourceHandle: source
      target: parse_state
      targetHandle: target
    - id: parse_state-source-classify
      source: parse_state
      sourceHandle: source
      target: classify
      targetHandle: target
    - id: classify-source-parse_intent
      source: classify
      sourceHandle: source
      target: parse_intent
      targetHandle: target
    - id: parse_intent-source-memory
      source: parse_intent
      sourceHandle: source
      target: memory
      targetHandle: target
    - id: memory-source-parse_context
      source: memory
      sourceHandle: source
      target: parse_context
      targetHandle: target
    - id: parse_context-source-branch
      source: parse_context
      sourceHandle: source
      target: branch
      targetHandle: target
    - id: branch-order-act_order
      source: branch
      sourceHandle: order
      target: act_order
      targetHandle: target
    - id: branch-gossip-act_gossip
      source: branch
      sourceHandle: gossip
      target: act_gossip
      targetHandle: target
    - id: branch-prank-act_prank
      source: branch
